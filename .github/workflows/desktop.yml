# Build the desktop application for Windows, macOS and Linux at once.
#
# PYINSTALLER CANNOT CROSS-COMPILE. It freezes the interpreter of the
# machine it runs on, so a Windows .exe has to be built on Windows and a
# .app on a Mac. Three runners is how one person with one laptop ships all
# three, and it is the whole reason this file exists.
name: Desktop application

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple silicon
            artifact: Helix-macOS-arm64
          - os: macos-13          # Intel, for anybody on an older Mac
            artifact: Helix-macOS-x86_64
          - os: windows-latest
            artifact: Helix-Windows
          - os: ubuntu-latest
            artifact: Helix-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pywebview needs the GTK bindings on Linux; on Windows and macOS the
      # system web engine is already there.
      - name: System web engine (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
                                  gir1.2-webkit2-4.1 libcairo2-dev libgirepository1.0-dev

      - name: Build tools
        run: python -m pip install --upgrade pip pyinstaller pywebview

      - name: The tests must pass before anything is packaged
        run: |
          python -m pip install pytest
          python -m pytest tests -q

      - name: Build
        run: python build_app.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
