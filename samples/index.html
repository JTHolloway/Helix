<h1>Helix — Sample Family</h1>
<p class=sub>Every design, rendered from the same family. Click a picture for
the SVG, or take the PDF straight to a printer — both are at true physical size.</p>
<div class=grid><figure><a href="svg/dendrogram.svg"><img src="svg/dendrogram.svg" loading="lazy"></a><figcaption><b>Classic Tree</b> <em>linear</em><p>The familiar left-to-right family tree, drawn properly: elbow connectors, aligned generations, tidy sibling groups.</p><p class="g">Good for: Reference printing, checking your data, sharing with relatives who want something conventional.</p><p class="m">23 people &middot; 841&times;594 mm &middot; laser: excellent</p><p><a href="pdf/dendrogram.pdf">PDF</a> &middot; <a href="svg/dendrogram.svg">SVG</a> &middot; <code>dendrogram</code></p></figcaption></figure><figure><a href="svg/hourglass.svg"><img src="svg/hourglass.svg" loading="lazy"></a><figcaption><b>Hourglass</b> <em>linear</em><p>Your ancestors fanning upward, your descendants fanning downward, with you at the waist.</p><p class="g">Good for: A chart centred on one living person. The most natural shape when you are the point of the exercise.</p><p class="m">7 people &middot; 841&times;1189 mm &middot; laser: excellent</p><p><a href="pdf/hourglass.pdf">PDF</a> &middot; <a href="svg/hourglass.svg">SVG</a> &middot; <code>hourglass</code></p></figcaption></figure><figure><a href="svg/icicle.svg"><img src="svg/icicle.svg" loading="lazy"></a><figcaption><b>Proportional Bands</b> <em>linear</em><p>Stacked bands whose width is proportional to how many descendants each person has. A sunburst unrolled flat.</p><p class="g">Good for: Seeing at a glance which lines flourished and which died out.</p><p class="m">23 people &middot; 1189&times;594 mm &middot; laser: excellent</p><p><a href="pdf/icicle.pdf">PDF</a> &middot; <a href="svg/icicle.svg">SVG</a> &middot; <code>icicle</code></p></figcaption></figure><figure><a href="svg/timeline_lanes.svg"><img src="svg/timeline_lanes.svg" loading="lazy"></a><figcaption><b>Timeline Lanes</b> <em>linear</em><p>A year axis across the page; every person is a bar from birth to death, stacked in generation bands.</p><p class="g">Good for: Long thin posters. The clearest possible view of who overlapped with whom.</p><p class="m">23 people &middot; 1189&times;594 mm &middot; laser: excellent</p><p><a href="pdf/timeline_lanes.pdf">PDF</a> &middot; <a href="svg/timeline_lanes.svg">SVG</a> &middot; <code>timeline_lanes</code></p></figcaption></figure><figure><a href="svg/metro_map.svg"><img src="svg/metro_map.svg" loading="lazy"></a><figcaption><b>Transit Map</b> <em>linear</em><p>The classic underground-map treatment: octilinear routes in flat colour, tick stations, ringed interchanges, horizontal labels.</p><p class="g">Good for: A wall piece people will actually stand and read. Handles many separate families elegantly.</p><p class="m">23 people &middot; 1189&times;841 mm &middot; laser: good</p><p><a href="pdf/metro_map.pdf">PDF</a> &middot; <a href="svg/metro_map.svg">SVG</a> &middot; <code>metro_map</code></p></figcaption></figure><figure><a href="svg/treemap.svg"><img src="svg/treemap.svg" loading="lazy"></a><figcaption><b>Treemap</b> <em>linear</em><p>Nested rectangles sized by how many people descend from each line. The branches that thrived are the big ones.</p><p class="g">Good for: Seeing at a glance which parts of a family grew and which died out — the one thing a tidy tree hides.</p><p class="m">23 people &middot; 1000&times;700 mm &middot; laser: good</p><p><a href="pdf/treemap.pdf">PDF</a> &middot; <a href="svg/treemap.svg">SVG</a> &middot; <code>treemap</code></p></figcaption></figure><figure><a href="svg/arc_diagram.svg"><img src="svg/arc_diagram.svg" loading="lazy"></a><figcaption><b>Arc Diagram</b> <em>network</em><p>Everyone on one line in date order; every parent-child link is a semicircle above it. Cousin marriages show as unmistakable loops.</p><p class="g">Good for: Spotting pedigree collapse and endogamy.</p><p class="m">23 people &middot; 1189&times;420 mm &middot; laser: good</p><p><a href="pdf/arc_diagram.pdf">PDF</a> &middot; <a href="svg/arc_diagram.svg">SVG</a> &middot; <code>arc_diagram</code></p></figcaption></figure><figure><a href="svg/hive.svg"><img src="svg/hive.svg" loading="lazy"></a><figcaption><b>Hive Plot</b> <em>network</em><p>One straight axis per family line; every marriage arcs between two axes. Intermarriage stops being a suspicion and becomes a count.</p><p class="g">Good for: Analysing how a few families married into each other over generations.</p><p class="m">23 people &middot; 900&times;900 mm &middot; laser: good</p><p><a href="pdf/hive.pdf">PDF</a> &middot; <a href="svg/hive.svg">SVG</a> &middot; <code>hive</code></p></figcaption></figure><figure><a href="svg/sugiyama.svg"><img src="svg/sugiyama.svg" loading="lazy"></a><figcaption><b>Layered Network</b> <em>network</em><p>Proper layered graph drawing with crossing minimisation. The one design that handles heavy cousin marriage without spaghetti.</p><p class="g">Good for: Tangled trees where the simple layouts give up.</p><p class="m">23 people &middot; 1189&times;841 mm &middot; laser: good</p><p><a href="pdf/sugiyama.pdf">PDF</a> &middot; <a href="svg/sugiyama.svg">SVG</a> &middot; <code>sugiyama</code></p></figcaption></figure><figure><a href="svg/circle_pack.svg"><img src="svg/circle_pack.svg" loading="lazy"></a><figcaption><b>Nested Families</b> <em>network</em><p>Each family is a circle; its children are circles inside it. Nesting depth is descent.</p><p class="g">Good for: Grasping the shape of a family at a glance, without dates.</p><p class="m">23 people &middot; 700&times;700 mm &middot; laser: good</p><p><a href="pdf/circle_pack.pdf">PDF</a> &middot; <a href="svg/circle_pack.svg">SVG</a> &middot; <code>circle_pack</code></p></figcaption></figure><figure><a href="svg/sankey.svg"><img src="svg/sankey.svg" loading="lazy"></a><figcaption><b>River of Descent</b> <em>network</em><p>Ribbons whose width is the number of descendants flowing forward through time. A line that dies out visibly narrows to nothing.</p><p class="g">Good for: Emotional impact. Showing which branches carried on.</p><p class="m">23 people &middot; 1189&times;700 mm &middot; laser: poor</p><p><a href="pdf/sankey.pdf">PDF</a> &middot; <a href="svg/sankey.svg">SVG</a> &middot; <code>sankey</code></p></figcaption></figure><figure><a href="svg/radial_rings.svg"><img src="svg/radial_rings.svg" loading="lazy"></a><figcaption><b>Concentric Rings</b> <em>radial</em><p>One ring per generation, joined by radial branches. Crowded sibling groups stagger into two or three alternating rows, and every name is aligned at the end of its own branch.</p><p class="g">Good for: The circular-maze look, and the most legible radial design here — the rings are sized to fit the names, not the other way round.</p><p class="m">23 people &middot; 1000&times;1000 mm &middot; laser: excellent</p><p><a href="pdf/radial_rings.pdf">PDF</a> &middot; <a href="svg/radial_rings.svg">SVG</a> &middot; <code>radial_rings</code></p></figcaption></figure><figure><a href="svg/radial_family.svg"><img src="svg/radial_family.svg" loading="lazy"></a><figcaption><b>Family Rings</b> <em>radial</em><p>One cell per couple, one ring per generation, founders at the centre.</p><p class="g">Good for: The whole family at once, when you want to trace who married whom and which children are whose.</p><p class="m">23 people &middot; 369&times;184 mm &middot; laser: good</p><p><a href="pdf/radial_family.pdf">PDF</a> &middot; <a href="svg/radial_family.svg">SVG</a> &middot; <code>radial_family</code></p></figcaption></figure><figure><a href="svg/fan_180.svg"><img src="svg/fan_180.svg" loading="lazy"></a><figcaption><b>Half Fan</b> <em>radial</em><p>The traditional pedigree fan: you at the centre, your ancestors spreading outward over a half circle.</p><p class="g">Good for: A mantelpiece. Fits a conventional frame, and every generation doubles neatly.</p><p class="m">7 people &middot; 460&times;460 mm &middot; laser: excellent</p><p><a href="pdf/fan_180.pdf">PDF</a> &middot; <a href="svg/fan_180.svg">SVG</a> &middot; <code>fan_180</code></p></figcaption></figure><figure><a href="svg/radial_lifeline.svg"><img src="svg/radial_lifeline.svg" loading="lazy"></a><figcaption><b>Radial Lifelines</b> <em>radial</em><p>Each person is a bar running from the year they were born to the year they died. Bar length IS lifespan.</p><p class="g">Good for: Seeing infant mortality, epidemics and long-lived matriarchs at a glance. The most information-dense design.</p><p class="m">23 people &middot; 700&times;700 mm &middot; laser: excellent</p><p><a href="pdf/radial_lifeline.pdf">PDF</a> &middot; <a href="svg/radial_lifeline.svg">SVG</a> &middot; <code>radial_lifeline</code></p></figcaption></figure><figure><a href="svg/radial_organic.svg"><img src="svg/radial_organic.svg" loading="lazy"></a><figcaption><b>Radial Roots</b> <em>radial</em><p>Tapering curves that thicken toward the centre like a root system. People are dots; the structure does the talking.</p><p class="g">Good for: Elegant posters; a delicate, natural look.</p><p class="m">23 people &middot; 650&times;650 mm &middot; laser: good</p><p><a href="pdf/radial_organic.pdf">PDF</a> &middot; <a href="svg/radial_organic.svg">SVG</a> &middot; <code>radial_organic</code></p></figcaption></figure><figure><a href="svg/radial_sunburst.svg"><img src="svg/radial_sunburst.svg" loading="lazy"></a><figcaption><b>Radial Sunburst</b> <em>radial</em><p>Annular cells radiating outward. Bold, architectural, unmistakably a family tree.</p><p class="g">Good for: Large families; engraving; a first look at your whole tree.</p><p class="m">23 people &middot; 600&times;600 mm &middot; laser: excellent</p><p><a href="pdf/radial_sunburst.pdf">PDF</a> &middot; <a href="svg/radial_sunburst.svg">SVG</a> &middot; <code>radial_sunburst</code></p></figcaption></figure><figure><a href="svg/radial_spiral.svg"><img src="svg/radial_spiral.svg" loading="lazy"></a><figcaption><b>Time Spiral</b> <em>radial</em><p>One continuous Archimedean spiral of years. Everyone sits on the spiral at the moment they were born, with branches linking them.</p><p class="g">Good for: Long thin lineages; emphasising time over structure.</p><p class="m">23 people &middot; 600&times;600 mm &middot; laser: good</p><p><a href="pdf/radial_spiral.pdf">PDF</a> &middot; <a href="svg/radial_spiral.svg">SVG</a> &middot; <code>radial_spiral</code></p></figcaption></figure><figure><a href="svg/geo_map.svg"><img src="svg/geo_map.svg" loading="lazy"></a><figcaption><b>Map View</b> <em>spatial</em><p>People at the place they were born, with lines showing how the family moved. Places without coordinates are laid out around the edge and said so.</p><p class="g">Good for: Families that moved. Turns the chart into a story of place rather than of time.</p><p class="m">23 people &middot; 1000&times;800 mm &middot; laser: excellent</p><p><a href="pdf/geo_map.pdf">PDF</a> &middot; <a href="svg/geo_map.svg">SVG</a> &middot; <code>geo_map</code></p></figcaption></figure><figure><a href="svg/constellation.svg"><img src="svg/constellation.svg" loading="lazy"></a><figcaption><b>Star Chart</b> <em>spatial</em><p>The family as a night sky: each person a star whose brightness is how many descend from them, joined by the lines of descent.</p><p class="g">Good for: A piece for a wall. Beautiful rather than analytical, and it engraves superbly on dark stock.</p><p class="m">23 people &middot; 900&times;900 mm &middot; laser: good</p><p><a href="pdf/constellation.pdf">PDF</a> &middot; <a href="svg/constellation.svg">SVG</a> &middot; <code>constellation</code></p></figcaption></figure></div>
